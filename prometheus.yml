global:
  scrape_interval: 15s  # Định kỳ cào dữ liệu mỗi 15 giây

scrape_configs:
  - job_name: 'ecommerce-backend'
    # Chỉ định rõ endpoint metrics chuẩn của Spring Boot Actuator
    metrics_path: '/actuator/prometheus'
    static_configs:
      # Sử dụng trực tiếp Tên Service thay vì localhost hay IP động
      - targets: ['ecommerce-api:8080']